# Album of the day: one album a day from Apple Music's list of the 100 best albums, its cover on a tile with its place in
# the list, its title and its artist. A tap opens it, with a key that plays it through Music Assistant on the speakers
# chosen for the tile, and a key that shows its tracks. The list is built into the screen (tools/build_albums.py); only
# the covers come from the internet. docs/MANIFEST.md of the Tessera plugins repository has every field.
id: album_of_the_day
version: 0.3.0
api: "0.15"
icon: album
maintainer: vrklgn
license: MIT
stage: beta
topics: [media]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 64

permissions:
  # The covers, from Apple's picture host.
  network: [is1-ssl.mzstatic.com]
  # The album played on the tile's Music Assistant player, found by its title and artist; the other speakers chosen
  # joined to that player first.
  # Pause and go on, and the volume, on that player. No action skips a track.
  home_assistant_actions: [music_assistant.play_media, media_player.join, media_player.media_play_pause,
                           media_player.volume_set, media_player.volume_up, media_player.volume_down]
attributes: [cloud]
privacy: https://github.com/vrklgn/tessera-album#privacy

tiles:
  - id: album
    name: tile_name
    icon: album
    sizes: { min: 1x1, max: 4x4 }
    # Five labels, a block and a picture's place, and the tile's own numbers and names.
    memory: 1500
    pictures: 1
    # The speaker that plays the album: a Music Assistant player (only those carry `mass_player_type`). What it plays
    # now says whether the album of the day is on.
    domains: [media_player]
    has_attributes: [mass_player_type]
    attributes: [media_album_name, media_artist, media_title, volume_level]
    example: tile_example
    options:
      - { id: also_1, kind: entity, domains: [media_player], label: also_1, hint: also_hint }
      - { id: also_2, kind: entity, domains: [media_player], label: also_2, hint: also_hint }
      - { id: order, kind: choice, label: order, hint: order_hint, default: countdown,
          choices: [{ value: countdown, label: order_countdown }, { value: mixed, label: order_mixed }] }
      # The card behind the tile: the usual one, none at all, or a tint in one of the colours of the Tessera mark.
      - { id: background, kind: choice, label: background, hint: background_hint, default: default,
          choices: [{ value: default, label: background_default }, { value: none, label: background_none },
                    { value: blue, label: background_blue }, { value: yellow, label: background_yellow },
                    { value: purple, label: background_purple }, { value: green, label: background_green }] }

cards:
  # The album, opened by a tap on the tile: its cover large, its place, title, artist and year, a sentence about it,
  # what plays now, a key that plays and pauses it, and round keys for its tracks and the volume.
  - { id: album, name: card_name, pictures: 1 }
